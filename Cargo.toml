[package]
name = "steamdex"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["full"] }
walkdir = "2.5.0"
